kotlin.code.style=official
org.gradle.configuration-cache=true
org.gradle.parallel=true
# UTF-8 for file contents regardless of the host locale. The JVM's
# file-name encoding (sun.jnu.encoding) cannot be overridden from the
# command line on JDK 18 and later; it follows the locale, so test names
# that reach the file system (Gradle writes one HTML report page per test
# method) must stay ASCII. A POSIX-locale container fails the report step
# otherwise: "Malformed input or input contains unmappable characters".
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m
# Dependency resolution retries with binary exponential backoff. Gradle
# already retries transient failures (HTTP 429 and 408, socket resets,
# timeouts) and doubles the wait each time, but the defaults are 3 tries
# from 1 s: about three seconds of patience. A cold cache behind a
# rate-limited egress proxy needs more. 8 tries from 2 s gives
# 2+4+8+16+32+64+128 s, about four minutes per artifact, before Gradle
# gives up and disables the repository for the build. No effect when the
# network is healthy.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
kotlin.compiler.execution.strategy=in-process
vaadin.productionMode=true
